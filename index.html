<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzair Arif's portfolio</title>
    <link rel="stylesheet" href="./public/style.css" />
    <link rel="icon" type="image/x-icon" href="./public/favicon.ico">
    <link rel="prefetch" href="./public/fog1.png" as="image">
  </head>
  <body>
    <header>
      <img src="./public/fog1.png" alt="" id="bgImage"/>
      <div class="h1Border"></div>
      <h1>Uzair Arif</h1>
      <div class="h1Border"></div>
      <img src="./public/fog1.png" alt="" class="fogImg"/>
      <img src="./public/fog1.png" alt="" class="fogImg"/>
    </header>
    <main>
      <div id="bugsContainer"></div>
      <div id="mainScreen">
        <div id="screenText">
          Uzair Arif,<br/>
          <span></span><br style="display: none;"/><span></span>
          <span class="caret">▌</span>
          <span style="opacity: 0;">A hobbyist programmer (based in Canada) who enjoys experimenting with new architectures and ideas, with the emphasis on high performance and minimal complexity.</span><br/>
          <span style="opacity: 0;">Preferred languages: C, Python, JS/TS, Java, C++, R.</span>
          <div id="bottomMainScreen">
            <button type="button" title="Show work experience" onclick="showWorkExp()">[Work Experience]</button>
            <button type="button" title="Add email to clipboard" onclick="wantEmail(event)">[Get Email]</button>
          </div>
        </div>
      </div>
      <div id="middleContent">
        <div id="floor"></div>
        <div id="leftWall"><div id="tvShadow"><div id="tvShadowLight"></div></div></div>
        <div id="rightWall"></div>
        <div id="tvContainer">
          <div id="tvDiv">
            <div id="tvScreenDiv">
              <div id="scanlineContainer"><img src="./public/tvGifs/static.gif" alt="" id="tvGif"/></div>
            </div>
          </div>
        </div>
        <div id="projectsContainer">
          <div id="buttonsContainer"></div>
        </div>
        <div id="infoScreen">
          <div id="infoScreenInner">
            <div id="infoScreenTitleContainer">
              <a target="_blank" id="infoScreenLink">[Github]</a>
              <h2 id="infoScreenTitle"></h2>
              <button type="button" onclick="closeInfoScreen()">[ESC]</button>
            </div>
            <div id="infoScreenText"></div>
          </div>
        </div>
      </div>
      <div id="textPopUp"></div>
    </main>
    <footer>
      <a target="_blank" title="linkedin" href="https://www.linkedin.com/in/uzair0845/">
        <div class="mask" style="mask-image: url(./public/footer_pics/linkedin_logo.png);"></div>
      </a>
      <a target="_blank" title="github" href="https://github.com/uzairarif5">
        <div class="mask" style="mask-image: url(./public/footer_pics/github_logo.png);animation-delay: 2s;"></div>
      </a>
      <a target="_blank" title="leetcode" href="https://leetcode.com/u/mysterious_person/">
        <div class="mask" style="mask-image: url(./public/footer_pics/leetcode_logo.png);animation-delay: 1s;"></div>
      </a>
    </footer>
  </body>
  <script>
    var g_counterForHideHeader = 2;
    var g_projectGifs = [];
    var g_lockedProjects;
    var g_workExpInfo;
    var g_infoScreenInfo = [null, null, null, null];
    var g_textPopUpInfo = [null, null];
    var g_tvGif;
    var g_tvGifImgHolder;
    var g_projectsInfo;
    var g_bugsToKill = 3;
    var g_bugsKilled = 0;
    var g_particleStore = [];

    window.onload = () => {
      window.setTimeout(showFogDiv, 1);
      window.setTimeout(showH1, 500);
      g_tvGif = document.getElementById("tvGif");
      g_tvGifImgHolder = new Image();
      g_tvGifImgHolder.src = "./public/tvGifs/static.gif";
      g_textPopUpInfo[0] = document.getElementById("textPopUp");
      g_infoScreenInfo = [
        document.getElementById("infoScreen"),
        document.getElementById("infoScreenLink"),
        document.getElementById("infoScreenTitle"),
        document.getElementById("infoScreenText")
      ];

      fetch("./public/info.json")
      .then(res => res.json())
      .then(res => {
        g_projectsInfo = res["projects"];
        g_lockedProjects = new Set(res["locked_projects"]);
        g_workExpInfo = res["WorkExperienceInfo"];
        document.getElementById("bottomMainScreen").classList.add("visible");
        addButtonsToMain();
        g_counterForHideHeader -= 1;
        hideHeader();
        window.setTimeout(createNewBug, 5000);
        startBugLoop();
      });

      document.onkeydown = (event) => {
        if (event.keyCode === 27) closeInfoScreen();
      }
    }

    function showFogDiv() {
      const fogImgs = document.querySelectorAll(".fogImg");
      fogImgs[0].style.opacity = 0.05;
      fogImgs[0].classList.add("goLeft");
      fogImgs[1].style.opacity = 0.05;
      fogImgs[1].classList.add("goRight");
    }

    function showH1() {
      const h1El = document.querySelector("h1");
      h1El.style.opacity = 1;
      h1El.style.transform = "scale(1.75, 1.75)";
      for(let h1border of document.getElementsByClassName("h1Border")) {
        h1border.style.opacity = 1;
        h1border.style.width = "300px";
      }
      window.setTimeout(() => {
        g_counterForHideHeader -= 1;
        hideHeader();
      }, 3500);
    }

    function hideHeader(){
      if (g_counterForHideHeader) return;
      const headerEl = document.querySelector("header");
      headerEl.style.opacity = 0;
      document.body.style.overflowY = "auto";
      window.setTimeout(() => {
        headerEl.remove();
        showMainScreenText();
      }, 2000);
    }

    function createNewBug() {
      let newBug = document.createElement("div");
      newBug.classList.add("bugDiv");
      let startSide = Math.floor(Math.random()*100) % 4;
      let xPos, yPos, rot;
      switch (startSide) {
        case 0: //top
          xPos = Math.random() * document.getElementById("bugsContainer").offsetWidth;
          yPos = -100;
          rot = Math.PI/2 + "rad";
          break;
        case 1: //left
          xPos = -100;
          yPos = Math.random() * document.getElementById("bugsContainer").offsetHeight;
          rot = "0rad";
          break;
        case 2: //bottom
          xPos = Math.random() * document.getElementById("bugsContainer").offsetWidth;
          yPos = document.getElementById("bugsContainer").offsetHeight + 100;
          rot = (3 * Math.PI/2) + "rad";
          break;
        case 3: //right
          xPos = document.getElementById("bugsContainer").offsetWidth + 100;
          yPos = Math.random() * document.getElementById("bugsContainer").offsetHeight;
          rot = Math.PI + "rad";
          break;
        default:
          console.error("Unknown case reached in createNewBug():", startSide);
      }
      newBug.style.left = xPos + "px";
      newBug.style.top = yPos + "px";
      newBug.style.rotate = rot;
      newBug.addEventListener("click", (event) => killBug(newBug, event.clientX, event.clientY));
      document.getElementById("bugsContainer").appendChild(newBug);
      window.setTimeout(() => removeBug(newBug), 50000);
      window.setTimeout(createNewBug, 20000);
    }

    function startBugLoop() {
      var bugIntv = window.setInterval(() =>{
        for (const bugDiv of document.getElementById("bugsContainer").children) {
          if (Math.random() < 0.1) {
            const change = (Math.random() - 0.5)/5;
            bugDiv.style.rotate = parseFloat(bugDiv.style.rotate) + change + "rad";
          }
          const rotAsFloat = parseFloat(bugDiv.style.rotate);
          bugDiv.style.left = parseFloat(bugDiv.style.left) + Math.cos(rotAsFloat) + "px";
          bugDiv.style.top = parseFloat(bugDiv.style.top) + Math.sin(rotAsFloat) + "px";
        }
      }, 50);
    }

    function killBug(bugDiv, x, y) {
      g_bugsKilled++;
      const text = "Killed " + g_bugsKilled + (g_bugsKilled == 1 ? " bug" : " bugs");
      showTextPopUp(text, x, y);
      const newTarget = g_bugsToKill - g_bugsKilled;
      if (newTarget >= 0) document.querySelectorAll(".locked").forEach((el) => {
        if (newTarget > 1) el.textContent = `[🔒] Kill ${newTarget} bugs to unlock`;
        else if (newTarget == 1) el.textContent = `[🔒] Kill ${newTarget} bug to unlock`;
        else {
          let i = parseInt(el.getAttribute("data-num"));
          el.textContent = g_projectsInfo[i][0];
          g_projectGifs[i].src = `./public/tvGifs/${g_projectsInfo[i][1]}`;
          el.onmouseenter = () => mouseEnteredButton(i);
          el.onmouseleave = () => g_tvGif.src = g_tvGifImgHolder.src;
          el.onclick = () => buttonClicked(i);
          el.classList.remove("locked");
        }
      })
      removeBug(bugDiv);
    }

    function removeBug(bugDiv) {
      if (!bugDiv) return;
      bugDiv.style.opacity = "0";
      window.setTimeout(() => bugDiv.remove(), 300);
    }

    function showWorkExp(){
      g_infoScreenInfo[1].removeAttribute("href");
      g_infoScreenInfo[2].textContent = "Work Experience";
      g_infoScreenInfo[3].innerHTML = g_workExpInfo;
      g_infoScreenInfo[0].classList.add("visible");
    }

    function wantEmail(event){
      navigator.clipboard.writeText("uzair.99@hotmail.com");
      showTextPopUp("Email copied to clipboard", event.clientX, event.clientY);
    }

    function addButtonsToMain(){
      const buttonsContainer = document.getElementById("buttonsContainer");

      const filler1 = document.createElement("div");
      filler1.classList.add("filler");
      buttonsContainer.appendChild(filler1);
      
      for (let i = 0; i < g_projectsInfo.length; i++) {
        let buttonEl = document.createElement("button");
        buttonEl.type = "button";
        g_projectGifs.push(new Image());
        if (g_lockedProjects.has(g_projectsInfo[i][0])) {
          buttonEl.textContent = `[🔒] Kill ${g_bugsToKill} bugs to unlock`;
          buttonEl.classList.add("locked");
          buttonEl.setAttribute("data-num", i);
        }
        else {
          buttonEl.textContent = g_projectsInfo[i][0];
          if (g_projectsInfo[i].length == 4) {
            g_projectGifs[i].src = `./public/tvGifs/${g_projectsInfo[i][1]}`;
            buttonEl.onmouseenter = () => mouseEnteredButton(i);
            buttonEl.onmouseleave = () => g_tvGif.src = g_tvGifImgHolder.src;
            buttonEl.onclick = () => buttonClicked(i);
          }
        }
        buttonsContainer.appendChild(buttonEl);
      }
      
      const filler2 = document.createElement("div");
      filler2.classList.add("filler");
      buttonsContainer.appendChild(filler2);

      document.getElementById("buttonsContainer").style.pointerEvents = "all";
    }

    function mouseEnteredButton(i) { 
      if(g_tvGif.src !== g_projectGifs[i].src) g_tvGif.src = g_projectGifs[i].src; 
    }

    function buttonClicked(i) {
      g_infoScreenInfo[1].setAttribute("href", g_projectsInfo[i][3]);
      g_infoScreenInfo[2].textContent = g_projectsInfo[i][0];
      g_infoScreenInfo[3].innerHTML = g_projectsInfo[i][2];
      g_infoScreenInfo[0].classList.add("visible");
    }

    function closeInfoScreen(){ g_infoScreenInfo[0].classList.remove("visible"); }

    function showMainScreenText(){
      const screenSpans = document.querySelectorAll("#screenText span");
      const screenBrs = document.querySelectorAll("#screenText br");
      const toSpan1 = screenSpans[0];
      const toSpan2 = screenSpans[1];
      const fromSpan1 = screenSpans[3];
      const fromSpan2 = screenSpans[4];
      const caretEl = screenSpans[2];
      caretEl.classList.remove("caret");
      let completingFirst = true;
      const textInt = window.setInterval(() => {
        if (fromSpan1.textContent) {
          toSpan1.innerHTML += fromSpan1.textContent.charAt(0);
          fromSpan1.textContent = fromSpan1.textContent.slice(1);
        }
        else if (completingFirst) { //switch displays of two brs
          completingFirst = false;
          screenBrs[2].style.display = "none";
          screenBrs[1].style.display = "block";
        }
        else if (fromSpan2.textContent) {
          toSpan2.innerHTML += fromSpan2.textContent.charAt(0);
          fromSpan2.textContent = fromSpan2.textContent.slice(1);
        }
        else {
          clearInterval(textInt);
          caretEl.classList.add("caret");
        }
      }, 10);

      window.setTimeout(() => {
        document.getElementById("scanlineContainer").style.opacity = "1";
        document.getElementById("tvShadowLight").style.opacity = "0.5";
        addGlowParticlesToFooterButton();
      }, 1500);
    }

    function addGlowParticlesToFooterButton(){
      const footerLinks = document.querySelectorAll("footer a");
      const maxParsPerLink = 4;
      let flIdx;
      let prIdx;
      for(flIdx = 0; flIdx < footerLinks.length; flIdx++) {
        g_particleStore.push([]);
        for(prIdx = 0; prIdx < maxParsPerLink; prIdx++){
          let newParticle = document.createElement("div");
          newParticle.classList.add("particle");
          footerLinks[flIdx].appendChild(newParticle);
          g_particleStore[flIdx].push(newParticle);
        }
      }
      flIdx = 0;
      prIdx = 0;
      window.setInterval(() => {
        g_particleStore[flIdx][prIdx].style.left = `${Math.random() * 40}px`;
        g_particleStore[flIdx][prIdx].classList.add("particleUp");
        window.setTimeout(() => g_particleStore[flIdx][prIdx].classList.remove("particleUp"), 3100);
        prIdx = (prIdx+1) % maxParsPerLink;
        flIdx = (flIdx+1) % footerLinks.length;
      }, 500);
    }

    function showTextPopUp(text, x, y){
      if (g_textPopUpInfo[1]) clearTimeout(g_textPopUpInfo[1]);
      let textPopEl = g_textPopUpInfo[0];
      textPopEl.textContent = text;
      textPopEl.style.left = `${x}px`;
      textPopEl.style.top = `${y-22}px`;
      textPopEl.style.opacity = 1;
      g_textPopUpInfo[1] = window.setTimeout(()=> textPopEl.style.opacity = 0, 1500);
    }
  </script>
</html>
